name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # svelte-check and the build resolve $env/static/*, so the names have to
      # exist. .env.test holds the Supabase CLI's public demo values.
      - run: cp .env.test .env
      - run: npm run lint
      - run: npm run check
      - run: npm run build
