# Cloudflare Pages project for the SvelteKit app (the R2 tile worker has its own in worker/).
name = "vmabeta"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Build-time environment. Once `pages_build_output_dir` is set, this file is the
# source of truth and Pages stops applying the dashboard's variables — which is
# what broke every build after ef94a79. `$env/static/public` is resolved by
# rollup, so these two have to exist here or the build fails at the first import.
# Both are public by design: the publishable key ships in the client bundle, and
# RLS is what protects the data. Secrets are NOT here — they are Pages secrets,
# read at runtime through `$env/dynamic/private`.
[vars]
PUBLIC_SUPABASE_URL = "https://trioykjhhwrruwjsklfo.supabase.co"
PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_AM4mZdfVPWDkP37gsgkS5Q_1f-RHGrm"
