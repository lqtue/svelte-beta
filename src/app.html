<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eae7e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)" />
    <!-- Replay the reader's theme choice before the first paint. Without this
         a reader who picked dark gets a light flash on every navigation that
         reloads the document, because the stylesheet's default is
         `color-scheme: light dark` and the attribute only lands once the
         bundle runs. Raw string, same key as $lib/core/utils/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('vma-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage blocked: fall back to the system preference */
      }
    </script>
    <!-- Every map view fetches its rows from Supabase and then dozens of tiles
         from the IIIF worker. Both handshakes measured 70-180ms and neither
         starts until the bundle asks, so they sit at the head of the critical
         path. Warming them costs one connection each. -->
    <link rel="preconnect" href="https://iiif.maparchive.vn" crossorigin />
    <link rel="preconnect" href="https://trioykjhhwrruwjsklfo.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter as a variable axis, not four static cuts: `wght@400..800` is one
         file per unicode subset instead of four, which took the stylesheet from
         40 @font-face rules to 16. Be Vietnam Pro has no variable build, so it
         stays static — 600/700/800, the three weights headings and chrome
         actually use. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Be+Vietnam+Pro:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
